<div class="custom-carousel-wrapper">
  <p-carousel
    [value]="slides"
    [numVisible]="numVisible"
    [numScroll]="numScroll"
    [circular]="circular"
    [autoplayInterval]="autoSlide ? slideInterval : 0"
    [responsiveOptions]="responsiveOptions"
    [showIndicators]="showIndicators"
    [showNavigators]="showControls"
  >
  <ng-template let-slide pTemplate="item">
    <div class="carousel-item-wrapper">
      <img
        [src]="slide.image"
        [alt]="slide.alt || slide.title || 'Slide'"
        class="carousel-image"
        loading="lazy"
      />
      <div class="carousel-caption" *ngIf="slide.title">
        <h3 class="carousel-title">{{ slide.title }}</h3>
      </div>
    </div>
  </ng-template>
  </p-carousel>
</div>
