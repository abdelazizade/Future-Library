<div class="product-card" (click)="onCardClick()">
      <div class="product-image">
        <div class="discount-badge" *ngIf="product.discount">
          {{ getDiscountPercentage() }}% OFF
        </div>
        <img [src]="product.image" [alt]="product.name" loading="lazy">
      </div>
      <div class="product-details">
        <h3>{{ product.name }}</h3>
        <p class="description">{{ product.description | description }}</p>
        <div class="price-section">
          <span class="price">{{ product.price | currency }}</span>
          <span class="discount" *ngIf="product.discount">{{ product.discount | currency }}</span>
        </div>
        <button class="add-to-cart" [translate]="'product.addToCart'" (click)="buyOnWhatsApp($event)">Buy via WhatsApp</button>
      </div>
    </div>
